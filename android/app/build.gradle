plugins {
    id 'com.android.application'
}

// By default the APK is a STANDALONE LOCAL VAULT: the web app (repo public/)
// is bundled into the APK and served offline — no server, no URL needed.
// Optionally build against a self-hosted server instead:
//   gradle assembleDebug -PvaultUrl=https://vault.example.com
def vaultUrl = (project.findProperty('vaultUrl') ?: '').toString().trim()

android {
    namespace 'co.omninode.omnivault'
    compileSdk 34

    defaultConfig {
        applicationId 'co.omninode.omnivault'
        minSdk 26
        targetSdk 34
        versionCode 1
        versionName '1.0.0'
        buildConfigField 'String', 'VAULT_URL', "\"${vaultUrl}\""
    }

    buildFeatures {
        buildConfig true
    }

    // Optional release signing via environment variables (used by CI):
    //   OMNIVAULT_KEYSTORE_PATH, OMNIVAULT_KEYSTORE_PASSWORD,
    //   OMNIVAULT_KEY_ALIAS, OMNIVAULT_KEY_PASSWORD
    signingConfigs {
        if (System.env.OMNIVAULT_KEYSTORE_PATH) {
            release {
                storeFile file(System.env.OMNIVAULT_KEYSTORE_PATH)
                storePassword System.env.OMNIVAULT_KEYSTORE_PASSWORD
                keyAlias System.env.OMNIVAULT_KEY_ALIAS
                keyPassword System.env.OMNIVAULT_KEY_PASSWORD
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            if (System.env.OMNIVAULT_KEYSTORE_PATH) {
                signingConfig signingConfigs.release
            }
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

// Bundle the web app (repo public/) into the APK so the app works fully
// offline as a local vault. assets/ is generated — never commit it.
task cleanWebApp(type: Delete) {
    delete file(new File(projectDir, 'src/main/assets'))
}

task copyWebApp(type: Copy, dependsOn: 'cleanWebApp') {
    from new File(projectDir, '../../public')
    into new File(projectDir, 'src/main/assets')
}

preBuild.dependsOn 'copyWebApp'

// Intentionally empty: the wrapper uses zero third-party dependencies.
dependencies {
}
