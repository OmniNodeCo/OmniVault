name: Build APK

# Builds the OmniVault Android app — a STANDALONE LOCAL VAULT.
#
# The web app (public/) is bundled into the APK at build time, so no server
# and no URL are needed: the vault runs entirely on-device (WebCrypto +
# IndexedDB) with zero configuration. Runs automatically on changes to
# android/** or public/**, or manually on demand.

on:
  push:
    branches: [main]
    paths:
      - 'android/**'
      - 'public/**'
      - '.github/workflows/build.yml'
  pull_request:
    paths:
      - 'android/**'
      - 'public/**'
      - '.github/workflows/build.yml'
  workflow_dispatch:
    inputs:
      build_type:
        description: 'Which APK to build'
        required: false
        default: 'debug'
        type: choice
        options: ['debug', 'release']

permissions:
  contents: read

jobs:
  apk:
    name: Build local-vault APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Install Android SDK pieces (if missing)
        run: |
          set -e
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          SDKMANAGER=""
          for candidate in \
            "$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" \
            "$SDK_ROOT/cmdline-tools/bin/sdkmanager" \
            "$SDK_ROOT/tools/bin/sdkmanager"; do
            if [ -x "$candidate" ]; then SDKMANAGER="$candidate"; break; fi
          done
          if [ -z "$SDKMANAGER" ] && command -v sdkmanager >/dev/null 2>&1; then
            SDKMANAGER="sdkmanager"
          fi
          if [ -z "$SDKMANAGER" ]; then
            echo "sdkmanager not found — relying on the preinstalled SDK"
            exit 0
          fi
          echo "Using sdkmanager: $SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null 2>&1 || true
          "$SDKMANAGER" "platforms;android-34" "build-tools;34.0.0" >/dev/null

      - name: Build debug APK
        if: inputs.build_type != 'release'
        run: gradle -p android assembleDebug --no-daemon

      - name: Build release APK (unsigned)
        if: inputs.build_type == 'release'
        run: gradle -p android assembleRelease --no-daemon

      - name: Upload debug APK
        if: inputs.build_type != 'release'
        uses: actions/upload-artifact@v4
        with:
          name: OmniVault-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Upload release APK
        if: inputs.build_type == 'release'
        uses: actions/upload-artifact@v4
        with:
          name: OmniVault-release-unsigned-apk
          path: android/app/build/outputs/apk/release/app-release-unsigned.apk
          if-no-files-found: error
