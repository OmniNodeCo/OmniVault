name: Release

# Publishes a GitHub Release with the standalone LOCAL VAULT Android APK
# whenever a v* tag is pushed:
#
#   git tag v1.0.0 && git push origin v1.0.0
#
# No server URL is needed — the app bundles the web app and keeps the vault
# in on-device storage. Optional repo secrets for a SIGNED release APK:
#   OMNIVAULT_KEYSTORE_B64      (base64 of a release keystore)
#   OMNIVAULT_KEYSTORE_PASSWORD, OMNIVAULT_KEY_ALIAS, OMNIVAULT_KEY_PASSWORD
# Without keystore secrets the APK is unsigned (installable after signing
# yourself, e.g. with apksigner). SHA-256 checksums are attached to the
# release for every artifact.

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing tag to release (e.g. v1.0.0)'
        required: true

permissions:
  contents: write

jobs:
  apk:
    name: Release local-vault APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Install Android SDK pieces (if missing)
        run: |
          set -e
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          SDKMANAGER=""
          for candidate in \
            "$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" \
            "$SDK_ROOT/cmdline-tools/bin/sdkmanager" \
            "$SDK_ROOT/tools/bin/sdkmanager"; do
            if [ -x "$candidate" ]; then SDKMANAGER="$candidate"; break; fi
          done
          if [ -z "$SDKMANAGER" ] && command -v sdkmanager >/dev/null 2>&1; then
            SDKMANAGER="sdkmanager"
          fi
          if [ -z "$SDKMANAGER" ]; then
            echo "sdkmanager not found — relying on the preinstalled SDK"
            exit 0
          fi
          echo "Using sdkmanager: $SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null 2>&1 || true
          "$SDKMANAGER" "platforms;android-34" "build-tools;34.0.0" >/dev/null

      - name: Decode signing keystore (if provided)
        env:
          KEYSTORE_B64: ${{ secrets.OMNIVAULT_KEYSTORE_B64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$HOME/omnivault-release.keystore"
            echo "OMNIVAULT_KEYSTORE_PATH=$HOME/omnivault-release.keystore" >> "$GITHUB_ENV"
            echo "Keystore decoded — release will be signed."
          else
            echo "No keystore secret — release will be unsigned."
          fi

      - name: Build release APK
        env:
          OMNIVAULT_KEYSTORE_PASSWORD: ${{ secrets.OMNIVAULT_KEYSTORE_PASSWORD }}
          OMNIVAULT_KEY_ALIAS: ${{ secrets.OMNIVAULT_KEY_ALIAS }}
          OMNIVAULT_KEY_PASSWORD: ${{ secrets.OMNIVAULT_KEY_PASSWORD }}
        run: gradle -p android assembleRelease --no-daemon

      - name: Collect artifacts and checksums
        env:
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          mkdir -p apk
          APK=$(find android/app/build/outputs/apk/release -name '*.apk' | head -n 1)
          if [ -z "$APK" ]; then echo "No APK produced"; exit 1; fi
          cp "$APK" "apk/OmniVault-${TAG}.apk"
          if [ -n "$OMNIVAULT_KEYSTORE_PATH" ]; then
            echo "signed" > apk/signature.txt
          else
            echo "unsigned (add keystore secrets to sign releases)" > apk/signature.txt
          fi
          cd apk && sha256sum * > checksums.txt && cat checksums.txt

      - name: Create GitHub Release and upload APK
        env:
          TAG: ${{ inputs.tag || github.ref_name }}
          GH_TOKEN: ${{ github.token }}
        run: |
          NOTES="OmniVault ${TAG} — Android local vault APK.

          A standalone, fully offline encrypted vault: the whole app is bundled in the APK and all data (passwords, notes, images) is encrypted on-device with WebCrypto and stored in app-private storage. No server, no account, no URL configuration.

          - Uninstalling the app deletes the vault — use the in-app encrypted backup (Settings → Export) to move data.
          - Forgot-password resets use the one-time recovery code shown at signup.
          - Prefer syncing across devices? Run the server (Docker or Node) and install the PWA instead.
          - SHA-256 checksums are in \`checksums.txt\`; signature status in \`signature.txt\`."
          if gh release view "$TAG" > /dev/null 2>&1; then
            gh release upload "$TAG" apk/* --clobber
          else
            gh release create "$TAG" --title "OmniVault $TAG" --notes "$NOTES" --verify-tag apk/*
          fi
