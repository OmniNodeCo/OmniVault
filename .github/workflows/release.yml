name: Release

# Publishes a GitHub Release with the standalone LOCAL VAULT Android APK
# whenever a v* tag is pushed:
#
#   git tag v1.0.0 && git push origin v1.0.0
#
# or manually: Actions → Release → Run workflow with a tag name (run it on
# the branch you want to release). If the tag does not exist yet it is
# created from the commit the workflow runs on.
# No server URL is needed — the app bundles the web app and keeps the vault
# in on-device storage. Release APKs are ALWAYS signed (Android refuses to
# install unsigned APKs — that yields "App not installed"):
#   - with the repo release keystore when these secrets are set:
#       OMNIVAULT_KEYSTORE_B64      (base64 of a release keystore)
#       OMNIVAULT_KEYSTORE_PASSWORD, OMNIVAULT_KEY_ALIAS, OMNIVAULT_KEY_PASSWORD
#     A stable key lets new builds install over older ones (in-app updates
#     work) — recommended.
#   - otherwise with a keystore generated on the fly (CI test key, unique
#     per run — installing over a differently-signed build requires an
#     uninstall first: export the vault first!).
# SHA-256 checksums are attached to every release.

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to release, e.g. v1.0.0 (created from this commit if it does not exist yet)'
        required: true

permissions:
  contents: write

jobs:
  apk:
    name: Release local-vault APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve tag (check out existing, or create from this commit)
        env:
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          set -e
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if git ls-remote --exit-code --tags origin "refs/tags/$TAG" > /dev/null 2>&1; then
            echo "Tag $TAG exists — building the tagged commit."
            git fetch --tags --force origin
            git checkout -q "$TAG"
          else
            echo "Tag $TAG not found on the remote — creating it on $GITHUB_SHA."
            git tag -a "$TAG" -m "OmniVault $TAG"
            git push origin "refs/tags/$TAG"
          fi

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Install Android SDK pieces (if missing)
        run: |
          set -e
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          SDKMANAGER=""
          for candidate in \
            "$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" \
            "$SDK_ROOT/cmdline-tools/bin/sdkmanager" \
            "$SDK_ROOT/tools/bin/sdkmanager"; do
            if [ -x "$candidate" ]; then SDKMANAGER="$candidate"; break; fi
          done
          if [ -z "$SDKMANAGER" ] && command -v sdkmanager >/dev/null 2>&1; then
            SDKMANAGER="sdkmanager"
          fi
          if [ -z "$SDKMANAGER" ]; then
            echo "sdkmanager not found — relying on the preinstalled SDK"
            exit 0
          fi
          echo "Using sdkmanager: $SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null 2>&1 || true
          "$SDKMANAGER" "platforms;android-34" "build-tools;34.0.0" >/dev/null

      - name: Set up signing keystore (repo secret, or generated CI test key)
        env:
          KEYSTORE_B64: ${{ secrets.OMNIVAULT_KEYSTORE_B64 }}
          KEYSTORE_PASSWORD: ${{ secrets.OMNIVAULT_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.OMNIVAULT_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.OMNIVAULT_KEY_PASSWORD }}
        run: |
          set -e
          KS="$HOME/omnivault-release.keystore"
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$KS"
            {
              echo "OMNIVAULT_KEYSTORE_PATH=$KS"
              echo "OMNIVAULT_KEYSTORE_PASSWORD=$KEYSTORE_PASSWORD"
              echo "OMNIVAULT_KEY_ALIAS=$KEY_ALIAS"
              echo "OMNIVAULT_KEY_PASSWORD=$KEY_PASSWORD"
              echo "SIGNING_MODE=release keystore"
            } >> "$GITHUB_ENV"
            echo "Signing with the repository release keystore."
          else
            # No secrets configured — generate a test key so the APK is
            # still installable. The key is unique to this run: installing
            # over a differently-signed build requires an uninstall first
            # (export the vault before updating!).
            keytool -genkeypair -v \
              -keystore "$KS" -storetype PKCS12 \
              -storepass omnivault-ci -keypass omnivault-ci \
              -alias omnivault -keyalg RSA -keysize 2048 -validity 10000 \
              -dname "CN=OmniVault CI, O=OmniNodeCo, C=US"
            {
              echo "OMNIVAULT_KEYSTORE_PATH=$KS"
              echo "OMNIVAULT_KEYSTORE_PASSWORD=omnivault-ci"
              echo "OMNIVAULT_KEY_ALIAS=omnivault"
              echo "OMNIVAULT_KEY_PASSWORD=omnivault-ci"
              echo "SIGNING_MODE=CI test key (unique to this run)"
            } >> "$GITHUB_ENV"
            echo "No keystore secret — signing with a generated CI test key."
          fi

      - name: Build release APK (signed)
        run: gradle -p android assembleRelease --no-daemon

      - name: Collect artifacts and checksums
        env:
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          mkdir -p apk
          APK=$(find android/app/build/outputs/apk/release -name '*.apk' | head -n 1)
          if [ -z "$APK" ]; then echo "No APK produced"; exit 1; fi
          cp "$APK" "apk/OmniVault-${TAG}.apk"
          echo "signed ($SIGNING_MODE)" > apk/signature.txt
          cd apk && sha256sum * > checksums.txt && cat checksums.txt

      - name: Create GitHub Release and upload APK
        env:
          TAG: ${{ inputs.tag || github.ref_name }}
          GH_TOKEN: ${{ github.token }}
        run: |
          NOTES="OmniVault ${TAG} — Android local vault APK.

          A standalone, fully offline encrypted vault: the whole app is bundled in the APK and all data (passwords, notes, images) is encrypted on-device with WebCrypto and stored in app-private storage. No server, no account, no URL configuration.

          - Uninstalling the app deletes the vault — use the in-app encrypted backup (Settings → Export) to move data.
          - The app checks for newer releases automatically (menu → Check for updates) and downloads updates from this page.
          - Forgot-password resets use the one-time recovery code shown at signup.
          - Prefer syncing across devices? Run the server (Docker or Node) and install the PWA instead.
          - SHA-256 checksums are in \`checksums.txt\`; signature status in \`signature.txt\`.
          - If the APK is signed with a CI test key, that key is unique to this build: export your vault (Settings → Export) before installing a differently-signed build over it. Set the OMNIVAULT_KEYSTORE_* repository secrets for stable, upgrade-in-place releases."
          if gh release view "$TAG" > /dev/null 2>&1; then
            gh release upload "$TAG" apk/* --clobber
          else
            gh release create "$TAG" --title "OmniVault $TAG" --notes "$NOTES" --verify-tag apk/*
          fi
